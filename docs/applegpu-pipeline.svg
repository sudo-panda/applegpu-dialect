<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 690" width="1170" height="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AppleGPU compilation pipeline</title>
  <desc id="desc">A Triton kernel goes through Triton's own target-independent passes in Triton's process, such as convert_to_ttgpuir, coalesce, remove_layout_conversions and optimize_dot_operands, plus apple-accelerate-matmul from our Triton plugin, which gives dot products the simdgroup_matrix layout; Triton's passes then propagate it. The plugin's convert-triton-to-applegpu then lowers the kernel to per-thread gpu, applegpu and standard operations, using Triton's own LinearLayout, alignment analysis, threadgroup-memory allocation and barrier placement. This Triton part is optional and runs only in Triton's process. Its per-thread IR goes on to our applegpu passes and the MSL emitter, which the plugin links and runs in the same process; the per-thread IR can also be printed as text for applegpu-opt. Our tools never link Triton. Standard MLIR GPU code enters applegpu-opt directly. applegpu passes make the Apple choices by GPU family, and applegpu-translate emits MSL, which the Metal toolchain compiles to AIR and a metallib; the Metal runtime launches it on PyTorch's MPS stream without copies. Later, an AIR lowering pass produces the LLVM dialect with AIR intrinsics, and an AIR emitter serializes it to .air, checked against the MSL path.</desc>
  <style>
    .bg     { fill: #ffffff; }
    .group  { fill: #f6f8fa; stroke: #d0d7de; }
    .box    { fill: #ffffff; stroke: #57606a; }
    .later  { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 6 4; }
    .title  { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .label  { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .note   { fill: #59636e; font-size: 12px; }
    .small  { font-size: 11px; }
    .muted  { fill: #6e7781; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .edge   { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .edge-later { stroke: #8c959f; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .head   { fill: #57606a; }
    .head-later { fill: #8c959f; }
    .fe     { fill: #fbefff; stroke: #8250df; }
    .opt    { fill: #ddf4ff; stroke: #0969da; }
    .tr     { fill: #dafbe1; stroke: #1a7f37; }
    .mtl    { fill: #fff1e5; stroke: #bc4c00; }
    .t-fe   { fill: #8250df; }
    .t-opt  { fill: #0969da; }
    .t-tr   { fill: #1a7f37; }
    .t-mtl  { fill: #bc4c00; }
    .optional { fill: none; stroke: #8250df; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0d1117; }
      .group  { fill: #161b22; stroke: #30363d; }
      .box    { fill: #0d1117; stroke: #8b949e; }
      .later  { fill: #0d1117; stroke: #6e7681; }
      .title, .label { fill: #e6edf3; }
      .note   { fill: #9198a1; }
      .muted  { fill: #848d97; }
      .edge   { stroke: #8b949e; }
      .edge-later { stroke: #6e7681; }
      .head   { fill: #8b949e; }
      .head-later { fill: #6e7681; }
      .fe     { fill: #231a38; stroke: #ab7df8; }
      .opt    { fill: #0f2744; stroke: #4493f8; }
      .tr     { fill: #0f2a1a; stroke: #3fb950; }
      .mtl    { fill: #2d1a0c; stroke: #db6d28; }
      .t-fe   { fill: #bc8cff; }
      .t-opt  { fill: #58a6ff; }
      .t-tr   { fill: #56d364; }
      .t-mtl  { fill: #f0883e; }
      .optional { stroke: #ab7df8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-later" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head-later" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1170" height="690" rx="8"/>

  <!-- Column titles -->
  <text class="title t-fe" x="140" y="30" text-anchor="middle">Frontends</text>
  <text class="title mono t-opt" x="485" y="28" text-anchor="middle">applegpu-opt</text>
  <text class="note small" x="485" y="44" text-anchor="middle">or the same passes linked into the plugin</text>
  <text class="title mono t-tr" x="785" y="28" text-anchor="middle">applegpu-translate</text>
  <text class="note small" x="785" y="44" text-anchor="middle">or the emitter in the plugin</text>
  <text class="title t-mtl" x="1045" y="30" text-anchor="middle">Metal toolchain</text>

  <!-- Column backgrounds (drawn first so arrows sit on top) -->
  <rect class="group" x="340" y="50" width="290" height="580" rx="8"/>
  <rect class="group" x="680" y="50" width="210" height="580" rx="8"/>
  <rect class="group" x="940" y="50" width="210" height="580" rx="8"/>

  <!-- ===== Frontends ===== -->
  <!-- The optional Triton part, all in Triton's process -->
  <rect class="optional" x="18" y="50" width="244" height="380" rx="8"/>
  <text class="note small t-fe" x="140" y="424" text-anchor="middle">optional, in Triton's process</text>

  <rect class="box fe" x="30" y="60" width="220" height="50" rx="6"/>
  <text class="label" x="140" y="82" text-anchor="middle">Triton kernel</text>
  <text class="note" x="140" y="100" text-anchor="middle">@triton.jit, in Python</text>

  <rect class="box fe" x="30" y="130" width="220" height="156" rx="6"/>
  <text class="label" x="140" y="152" text-anchor="middle">Triton's own passes</text>
  <text class="note" x="140" y="170" text-anchor="middle">choose the layouts</text>
  <text class="note mono small" x="140" y="192" text-anchor="middle">TTIR, convert_to_ttgpuir</text>
  <text class="note mono small" x="140" y="208" text-anchor="middle">coalesce</text>
  <text class="note mono small" x="140" y="224" text-anchor="middle">remove_layout_conversions</text>
  <text class="note mono small" x="140" y="240" text-anchor="middle">optimize_dot_operands, …</text>
  <text class="label mono small t-fe" x="140" y="258" text-anchor="middle">+ apple-accelerate-matmul</text>
  <text class="note small" x="140" y="276" text-anchor="middle">(our Triton plugin)</text>

  <rect class="box fe" x="30" y="308" width="220" height="94" rx="6"/>
  <text class="label mono small t-fe" x="140" y="328" text-anchor="middle">convert-triton-to-applegpu</text>
  <text class="note small" x="140" y="344" text-anchor="middle">(our Triton plugin)</text>
  <text class="note small" x="140" y="362" text-anchor="middle">layouts → per-thread code, with</text>
  <text class="note small" x="140" y="377" text-anchor="middle">Triton's LinearLayout, alignment,</text>
  <text class="note small" x="140" y="392" text-anchor="middle">memory allocation and barriers</text>

  <rect class="box fe" x="30" y="460" width="220" height="90" rx="6"/>
  <text class="label" x="140" y="483" text-anchor="middle">Standard MLIR</text>
  <text class="note mono small" x="140" y="503" text-anchor="middle">gpu.module / gpu.func</text>
  <text class="note mono small" x="140" y="519" text-anchor="middle">gpu · memref · arith · scf</text>
  <text class="note mono small" x="140" y="535" text-anchor="middle">+ applegpu ops</text>

  <!-- ===== applegpu-opt ===== -->
  <text class="label t-opt" x="485" y="74" text-anchor="middle">AppleGPU dialect</text>
  <text class="note" x="485" y="91" text-anchor="middle">per-thread: pointers, SIMD-group ops,</text>
  <text class="note" x="485" y="107" text-anchor="middle">simdgroup_matrix · no Triton</text>

  <rect class="box opt" x="360" y="322" width="250" height="76" rx="6"/>
  <text class="label" x="485" y="344" text-anchor="middle">applegpu passes</text>
  <text class="note" x="485" y="363" text-anchor="middle">Apple choices by GPU family,</text>
  <text class="note" x="485" y="379" text-anchor="middle">verification of every input</text>

  <rect class="box" x="360" y="480" width="250" height="50" rx="6"/>
  <text class="label" x="485" y="502" text-anchor="middle">Per-thread IR</text>
  <text class="note mono small" x="485" y="520" text-anchor="middle">gpu + applegpu + standard</text>

  <rect class="later" x="360" y="571" width="250" height="50" rx="6"/>
  <text class="label mono muted" x="485" y="592" text-anchor="middle">convert-applegpu-to-air</text>
  <text class="note" x="485" y="610" text-anchor="middle">→ LLVM dialect + AIR intrinsics</text>

  <!-- ===== applegpu-translate ===== -->
  <rect class="box tr" x="695" y="453" width="180" height="104" rx="6"/>
  <text class="label" x="785" y="475" text-anchor="middle">MSL emitter</text>
  <text class="note mono small" x="785" y="492" text-anchor="middle">--mlir-to-msl</text>
  <text class="note" x="785" y="514" text-anchor="middle">prints already-lowered IR,</text>
  <text class="note" x="785" y="530" text-anchor="middle">makes no decisions</text>
  <text class="note" x="785" y="549" text-anchor="middle">unsupported op → emitError</text>

  <rect class="later" x="695" y="571" width="180" height="50" rx="6"/>
  <text class="label muted" x="785" y="592" text-anchor="middle">AIR emitter</text>
  <text class="note" x="785" y="610" text-anchor="middle">checked against MSL</text>

  <!-- ===== Metal toolchain ===== -->
  <rect class="box mtl" x="960" y="70" width="170" height="40" rx="6"/>
  <text class="label mono" x="1045" y="95" text-anchor="middle">.metal</text>

  <rect class="box mtl" x="960" y="150" width="170" height="40" rx="6"/>
  <text class="label mono" x="1045" y="175" text-anchor="middle">.air</text>

  <rect class="box mtl" x="960" y="230" width="170" height="40" rx="6"/>
  <text class="label mono" x="1045" y="255" text-anchor="middle">.metallib</text>

  <rect class="box mtl" x="960" y="310" width="170" height="66" rx="6"/>
  <text class="label" x="1045" y="331" text-anchor="middle">Metal runtime</text>
  <text class="note small" x="1045" y="349" text-anchor="middle">launches on PyTorch's</text>
  <text class="note small" x="1045" y="365" text-anchor="middle">MPS stream, no copies</text>

  <rect class="box mtl" x="960" y="416" width="170" height="40" rx="6"/>
  <text class="label" x="1045" y="441" text-anchor="middle">Apple GPU</text>

  <!-- ===== Arrows ===== -->
  <!-- Triton: kernel → Triton's passes → lowering → applegpu-opt -->
  <path class="edge" d="M140,110 L140,126" marker-end="url(#arrow)"/>
  <path class="edge" d="M140,286 L140,304" marker-end="url(#arrow)"/>
  <path class="edge" d="M250,345 L356,345" marker-end="url(#arrow)"/>
  <text class="note small" x="303" y="321" text-anchor="middle">per-thread IR,</text>
  <text class="note small" x="303" y="335" text-anchor="middle">in-process</text>

  <!-- Standard MLIR enters applegpu-opt directly -->
  <path class="edge" d="M250,505 L300,505 Q310,505 310,495 L310,385 Q310,375 320,375 L356,375" marker-end="url(#arrow)"/>
  <text class="note small" x="303" y="438" text-anchor="end">our tools</text>
  <text class="note small" x="303" y="452" text-anchor="end">never link</text>
  <text class="note small" x="303" y="466" text-anchor="end">Triton</text>

  <!-- within applegpu-opt -->
  <path class="edge" d="M485,398 L485,476" marker-end="url(#arrow)"/>
  <path class="edge-later" d="M485,530 L485,567" marker-end="url(#arrow-later)"/>

  <!-- applegpu-opt into applegpu-translate -->
  <path class="edge" d="M610,505 L691,505" marker-end="url(#arrow)"/>
  <path class="edge-later" d="M610,596 L691,596" marker-end="url(#arrow-later)"/>

  <!-- applegpu-translate into the Metal toolchain -->
  <path class="edge" d="M875,505 L902,505 Q912,505 912,495 L912,100 Q912,90 922,90 L956,90" marker-end="url(#arrow)"/>
  <path class="edge-later" d="M875,596 L916,596 Q926,596 926,586 L926,180 Q926,170 936,170 L956,170" marker-end="url(#arrow-later)"/>

  <!-- within the Metal toolchain -->
  <path class="edge" d="M1045,110 L1045,146" marker-end="url(#arrow)"/>
  <text class="note mono small" x="1056" y="134">metal -c</text>
  <path class="edge" d="M1045,190 L1045,226" marker-end="url(#arrow)"/>
  <text class="note mono small" x="1056" y="214">metallib</text>
  <path class="edge" d="M1045,270 L1045,306" marker-end="url(#arrow)"/>
  <path class="edge" d="M1045,376 L1045,412" marker-end="url(#arrow)"/>

  <!-- ===== Legend ===== -->
  <rect class="box" x="20" y="652" width="28" height="18" rx="4"/>
  <text class="note" x="56" y="665">MSL path</text>

  <rect class="later" x="150" y="652" width="28" height="18" rx="4"/>
  <text class="note" x="186" y="665">Later: AIR path</text>

  <rect class="optional" x="310" y="652" width="28" height="18" rx="4"/>
  <text class="note" x="346" y="665">Optional: Triton support (APPLEGPU_ENABLE_TRITON)</text>
</svg>
